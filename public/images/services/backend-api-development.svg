<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="backend-api-development-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>

    <!-- Ambient Glow Light Gradients -->
    <radialGradient id="backend-api-development-glow1" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="backend-api-development-glow2" cx="70%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="backend-api-development-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="backend-api-development-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="backend-api-development-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#backend-api-development-bg)"/>
  <rect width="800" height="450" fill="url(#backend-api-development-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="180" r="280" fill="url(#backend-api-development-glow1)"/>
  <circle cx="560" cy="300" r="240" fill="url(#backend-api-development-glow2)"/>

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="800" height="3" fill="url(#backend-api-development-accent)"/>

  <!-- Corner Tech Reticle Lines -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Central Custom Artwork -->
  
      <!-- Server Architecture & Endpoint Router Network -->
      <g transform="translate(240, 80)">
        <!-- Central Gateway Router -->
        <rect width="320" height="120" rx="14" fill="url(#backend-card-grad)" stroke="#10b981" stroke-width="1.5"/>
        <rect x="20" y="20" width="70" height="22" rx="6" fill="#10b981" fill-opacity="0.3"/>
        <text x="35" y="35" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">POST</text>
        <rect x="100" y="20" width="190" height="22" rx="4" fill="rgba(255,255,255,0.05)"/>
        
        <rect x="20" y="52" width="70" height="22" rx="6" fill="#06b6d4" fill-opacity="0.3"/>
        <text x="35" y="67" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">GET</text>
        <rect x="100" y="52" width="150" height="22" rx="4" fill="rgba(255,255,255,0.05)"/>

        <rect x="20" y="84" width="70" height="22" rx="6" fill="#f59e0b" fill-opacity="0.3"/>
        <text x="35" y="99" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">AUTH</text>
        <rect x="100" y="84" width="170" height="22" rx="4" fill="rgba(255,255,255,0.05)"/>
      </g>

      <!-- Distributed Microservice Cluster Nodes -->
      <g transform="translate(130, 240)">
        <rect width="150" height="130" rx="10" fill="#0a0f20" stroke="#10b981" stroke-width="1.2"/>
        <rect x="15" y="15" width="40" height="10" rx="3" fill="#10b981"/>
        <circle cx="125" cy="20" r="4" fill="#10b981"/>
        <path d="M 20 45 L 130 45 M 20 70 L 130 70 M 20 95 L 130 95" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <circle cx="35" cy="58" r="3" fill="#34d399"/>
        <circle cx="35" cy="83" r="3" fill="#34d399"/>
        <circle cx="35" cy="108" r="3" fill="#34d399"/>
      </g>

      <g transform="translate(325, 240)">
        <rect width="150" height="130" rx="10" fill="#0a0f20" stroke="#06b6d4" stroke-width="1.2"/>
        <rect x="15" y="15" width="40" height="10" rx="3" fill="#06b6d4"/>
        <circle cx="125" cy="20" r="4" fill="#06b6d4"/>
        <rect x="20" y="45" width="110" height="16" rx="4" fill="#06b6d4" fill-opacity="0.15"/>
        <rect x="20" y="70" width="110" height="16" rx="4" fill="#06b6d4" fill-opacity="0.15"/>
        <rect x="20" y="95" width="110" height="16" rx="4" fill="#06b6d4" fill-opacity="0.15"/>
      </g>

      <g transform="translate(520, 240)">
        <!-- Security / JWT Shield -->
        <rect width="150" height="130" rx="10" fill="#0a0f20" stroke="#8b5cf6" stroke-width="1.2"/>
        <path d="M 75 30 L 115 45 L 115 80 C 115 105, 75 118, 75 118 C 75 118, 35 105, 35 80 L 35 45 Z" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="2"/>
        <circle cx="75" cy="70" r="8" fill="#8b5cf6"/>
        <path d="M 75 78 L 75 88" stroke="#ffffff" stroke-width="2"/>
      </g>

      <!-- Connecting Data Pipelines -->
      <path d="M 320 200 L 205 240" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
      <path d="M 400 200 L 400 240" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4"/>
      <path d="M 480 200 L 595 240" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4"/>
    
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="content-creation-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>

    <!-- Ambient Glow Light Gradients -->
    <radialGradient id="content-creation-glow1" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="content-creation-glow2" cx="70%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="content-creation-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="content-creation-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="content-creation-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#content-creation-bg)"/>
  <rect width="800" height="450" fill="url(#content-creation-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="180" r="280" fill="url(#content-creation-glow1)"/>
  <circle cx="560" cy="300" r="240" fill="url(#content-creation-glow2)"/>

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="800" height="3" fill="url(#content-creation-accent)"/>

  <!-- Corner Tech Reticle Lines -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#ec4899" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#ec4899" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Central Custom Artwork -->
  
      <!-- Multimedia Studio Workspace -->
      <g transform="translate(150, 80)">
        <!-- Creative Canvas Board -->
        <rect width="340" height="240" rx="14" fill="#0c0e1e" stroke="#ec4899" stroke-width="1.5"/>
        <!-- Video Frame Preview -->
        <rect x="20" y="20" width="200" height="120" rx="8" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.3"/>
        <polygon points="110,65 140,80 110,95" fill="#ec4899"/>
        
        <!-- Timeline Controls -->
        <rect x="20" y="155" width="200" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
        <circle cx="90" cy="158" r="6" fill="#ec4899"/>

        <!-- Timeline Tracks -->
        <rect x="20" y="175" width="90" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.4"/>
        <rect x="115" y="175" width="105" height="18" rx="4" fill="#ec4899" fill-opacity="0.4"/>
        <rect x="20" y="200" width="140" height="18" rx="4" fill="#06b6d4" fill-opacity="0.4"/>

        <!-- Tools Palette Side panel -->
        <rect x="235" y="20" width="85" height="198" rx="8" fill="rgba(255,255,255,0.03)"/>
        <circle cx="260" cy="45" r="10" fill="#ec4899"/>
        <circle cx="295" cy="45" r="10" fill="#8b5cf6"/>
        <circle cx="260" cy="75" r="10" fill="#f59e0b"/>
        <circle cx="295" cy="75" r="10" fill="#06b6d4"/>
        <rect x="245" y="105" width="65" height="12" rx="3" fill="rgba(255,255,255,0.2)"/>
        <rect x="245" y="125" width="65" height="12" rx="3" fill="rgba(255,255,255,0.2)"/>
        <rect x="245" y="145" width="65" height="12" rx="3" fill="rgba(255,255,255,0.2)"/>
      </g>

      <!-- Floating Storyboard Cards -->
      <g transform="translate(520, 100)">
        <rect width="130" height="95" rx="10" fill="#0c0e1e" stroke="#8b5cf6" stroke-width="1.5" transform="rotate(8)"/>
        <rect x="15" y="15" width="100" height="50" rx="4" fill="#8b5cf6" fill-opacity="0.25" transform="rotate(8)"/>
      </g>
      <g transform="translate(510, 210)">
        <rect width="140" height="100" rx="10" fill="#0c0e1e" stroke="#ec4899" stroke-width="1.5" transform="rotate(-5)"/>
        <rect x="15" y="15" width="110" height="50" rx="4" fill="#ec4899" fill-opacity="0.25" transform="rotate(-5)"/>
      </g>
    
</svg>
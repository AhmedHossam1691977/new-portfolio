<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="copywriting-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>

    <!-- Ambient Glow Light Gradients -->
    <radialGradient id="copywriting-glow1" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="copywriting-glow2" cx="70%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="copywriting-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="copywriting-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="copywriting-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#copywriting-bg)"/>
  <rect width="800" height="450" fill="url(#copywriting-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="180" r="280" fill="url(#copywriting-glow1)"/>
  <circle cx="560" cy="300" r="240" fill="url(#copywriting-glow2)"/>

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="800" height="3" fill="url(#copywriting-accent)"/>

  <!-- Corner Tech Reticle Lines -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#6366f1" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#6366f1" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Central Custom Artwork -->
  
      <!-- High-Conversion Messaging Editor Workspace -->
      <g transform="translate(180, 80)">
        <rect width="440" height="270" rx="14" fill="#090d1c" stroke="#6366f1" stroke-width="1.5"/>
        
        <!-- Document Header Bar -->
        <rect x="25" y="25" width="40" height="8" rx="3" fill="#6366f1"/>
        <circle cx="380" cy="29" r="6" fill="#22c55e"/>
        <circle cx="400" cy="29" r="6" fill="#6366f1"/>

        <!-- Headline Block (Big Bold Messaging) -->
        <rect x="25" y="55" width="280" height="22" rx="6" fill="#6366f1" fill-opacity="0.4"/>
        <rect x="25" y="85" width="360" height="16" rx="4" fill="rgba(255,255,255,0.6)"/>
        
        <!-- Body Copy Paragraph Lines -->
        <rect x="25" y="120" width="390" height="8" rx="2" fill="rgba(255,255,255,0.25)"/>
        <rect x="25" y="138" width="370" height="8" rx="2" fill="rgba(255,255,255,0.25)"/>
        <rect x="25" y="156" width="340" height="8" rx="2" fill="rgba(255,255,255,0.25)"/>
        <rect x="25" y="174" width="380" height="8" rx="2" fill="rgba(255,255,255,0.25)"/>

        <!-- High-Impact CTA Button Wireframe -->
        <rect x="25" y="205" width="140" height="38" rx="8" fill="url(#copywriting-accent)"/>
        
        <!-- Text Cursor Cursor Caret -->
        <line x1="312" y1="52" x2="312" y2="78" stroke="#06b6d4" stroke-width="3"/>
      </g>
    
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ecommerce-development-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>

    <!-- Ambient Glow Light Gradients -->
    <radialGradient id="ecommerce-development-glow1" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="ecommerce-development-glow2" cx="70%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ecommerce-development-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="ecommerce-development-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="ecommerce-development-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#ecommerce-development-bg)"/>
  <rect width="800" height="450" fill="url(#ecommerce-development-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="180" r="280" fill="url(#ecommerce-development-glow1)"/>
  <circle cx="560" cy="300" r="240" fill="url(#ecommerce-development-glow2)"/>

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="800" height="3" fill="url(#ecommerce-development-accent)"/>

  <!-- Corner Tech Reticle Lines -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Central Custom Artwork -->
  
      <!-- E-Commerce Storefront & Checkout Flow -->
      <g transform="translate(140, 80)">
        <!-- Main Shop Layout -->
        <rect width="320" height="260" rx="14" fill="#0a0e1a" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
        <!-- Store Navigation -->
        <rect x="20" y="18" width="60" height="10" rx="3" fill="#f59e0b"/>
        <rect x="240" y="14" width="60" height="20" rx="10" fill="#f59e0b" fill-opacity="0.2"/>
        <!-- Product Grid (4 Products) -->
        <g transform="translate(20, 50)">
          <!-- Card 1 -->
          <rect width="130" height="85" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
          <rect x="10" y="10" width="110" height="40" rx="5" fill="#f59e0b" fill-opacity="0.15"/>
          <rect x="10" y="58" width="60" height="8" rx="2" fill="rgba(255,255,255,0.5)"/>
          <rect x="85" y="58" width="35" height="16" rx="4" fill="#10b981" fill-opacity="0.8"/>
        </g>
        <g transform="translate(170, 50)">
          <!-- Card 2 -->
          <rect width="130" height="85" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
          <rect x="10" y="10" width="110" height="40" rx="5" fill="#10b981" fill-opacity="0.15"/>
          <rect x="10" y="58" width="60" height="8" rx="2" fill="rgba(255,255,255,0.5)"/>
          <rect x="85" y="58" width="35" height="16" rx="4" fill="#f59e0b" fill-opacity="0.8"/>
        </g>
        <g transform="translate(20, 150)">
          <!-- Card 3 -->
          <rect width="130" height="85" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
          <rect x="10" y="10" width="110" height="40" rx="5" fill="#06b6d4" fill-opacity="0.15"/>
          <rect x="10" y="58" width="60" height="8" rx="2" fill="rgba(255,255,255,0.5)"/>
          <rect x="85" y="58" width="35" height="16" rx="4" fill="#10b981" fill-opacity="0.8"/>
        </g>
        <g transform="translate(170, 150)">
          <!-- Card 4 -->
          <rect width="130" height="85" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
          <rect x="10" y="10" width="110" height="40" rx="5" fill="#8b5cf6" fill-opacity="0.15"/>
          <rect x="10" y="58" width="60" height="8" rx="2" fill="rgba(255,255,255,0.5)"/>
          <rect x="85" y="58" width="35" height="16" rx="4" fill="#f59e0b" fill-opacity="0.8"/>
        </g>
      </g>

      <!-- Shopping Cart & Secure Payment Gateway Card -->
      <g transform="translate(490, 100)">
        <rect width="180" height="230" rx="14" fill="#080c18" stroke="#10b981" stroke-width="1.5"/>
        <rect x="20" y="20" width="80" height="10" rx="3" fill="#10b981"/>
        <!-- Cart Items -->
        <rect x="20" y="45" width="140" height="35" rx="6" fill="rgba(255,255,255,0.04)"/>
        <rect x="20" y="90" width="140" height="35" rx="6" fill="rgba(255,255,255,0.04)"/>
        <!-- Total & Pay -->
        <rect x="20" y="145" width="140" height="1" fill="rgba(255,255,255,0.1)"/>
        <rect x="20" y="155" width="50" height="8" rx="3" fill="rgba(255,255,255,0.3)"/>
        <rect x="110" y="155" width="50" height="8" rx="3" fill="#10b981"/>
        <rect x="20" y="175" width="140" height="36" rx="8" fill="url(#ecommerce-accent)"/>
      </g>
    
</svg>
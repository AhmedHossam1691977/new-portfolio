<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="full-stack-web-development-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>

    <!-- Ambient Glow Light Gradients -->
    <radialGradient id="full-stack-web-development-glow1" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="full-stack-web-development-glow2" cx="70%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="full-stack-web-development-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="full-stack-web-development-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="full-stack-web-development-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#full-stack-web-development-bg)"/>
  <rect width="800" height="450" fill="url(#full-stack-web-development-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="180" r="280" fill="url(#full-stack-web-development-glow1)"/>
  <circle cx="560" cy="300" r="240" fill="url(#full-stack-web-development-glow2)"/>

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="800" height="3" fill="url(#full-stack-web-development-accent)"/>

  <!-- Corner Tech Reticle Lines -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Central Custom Artwork -->
  
      <!-- Multi-Tier Architecture Diagram -->
      <!-- Tier 1: Frontend Browser Layer -->
      <g transform="translate(140, 90)">
        <rect width="220" height="130" rx="12" fill="url(#fullstack-card-grad)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
        <rect x="15" y="15" width="40" height="6" rx="3" fill="#06b6d4" fill-opacity="0.8"/>
        <circle cx="185" cy="18" r="4" fill="#ef4444"/>
        <circle cx="197" cy="18" r="4" fill="#eab308"/>
        <circle cx="209" cy="18" r="4" fill="#22c55e"/>
        <rect x="15" y="35" width="190" height="1" fill="rgba(255,255,255,0.1)"/>
        <!-- UI Elements Mockup -->
        <rect x="15" y="45" width="60" height="65" rx="6" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.3"/>
        <rect x="85" y="45" width="120" height="16" rx="4" fill="#06b6d4" fill-opacity="0.25"/>
        <rect x="85" y="68" width="90" height="10" rx="3" fill="rgba(255,255,255,0.2)"/>
        <rect x="85" y="85" width="110" height="10" rx="3" fill="rgba(255,255,255,0.15)"/>
        <rect x="85" y="100" width="70" height="10" rx="3" fill="rgba(255,255,255,0.1)"/>
      </g>

      <!-- Connection Flow Lines -->
      <path d="M 360 155 L 440 155 L 440 220" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6,4"/>
      <circle cx="440" cy="155" r="5" fill="#06b6d4"/>

      <!-- Tier 2: Backend API Core Node -->
      <g transform="translate(380, 210)">
        <rect width="240" height="140" rx="14" fill="url(#fullstack-card-grad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
        <!-- Server Rack Graphic -->
        <rect x="20" y="20" width="200" height="28" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
        <circle cx="35" cy="34" r="4" fill="#10b981"/>
        <rect x="50" y="31" width="80" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
        <rect x="175" y="30" width="30" height="8" rx="4" fill="#10b981" fill-opacity="0.4"/>

        <rect x="20" y="56" width="200" height="28" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
        <circle cx="35" cy="70" r="4" fill="#10b981"/>
        <rect x="50" y="67" width="100" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
        <rect x="175" y="66" width="30" height="8" rx="4" fill="#10b981" fill-opacity="0.4"/>

        <rect x="20" y="92" width="200" height="28" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
        <circle cx="35" cy="106" r="4" fill="#10b981"/>
        <rect x="50" y="103" width="70" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
        <rect x="175" y="102" width="30" height="8" rx="4" fill="#10b981" fill-opacity="0.4"/>
      </g>

      <!-- Tier 3: Database & Auth Layer -->
      <g transform="translate(170, 270)">
        <rect width="180" height="90" rx="10" fill="url(#fullstack-card-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
        <path d="M 25 30 C 25 20, 65 20, 65 30 C 65 40, 25 40, 25 30 Z M 25 30 L 25 50 C 25 60, 65 60, 65 50 L 65 30 M 25 50 L 25 70 C 25 80, 65 80, 65 70 L 65 50" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <rect x="80" y="28" width="70" height="8" rx="3" fill="#38bdf8" fill-opacity="0.5"/>
        <rect x="80" y="44" width="85" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>
        <rect x="80" y="58" width="55" height="6" rx="2" fill="rgba(255,255,255,0.15)"/>
      </g>

      <!-- Interconnect lines -->
      <path d="M 260 220 L 260 270" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
      <path d="M 350 315 L 380 315" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
    
</svg>
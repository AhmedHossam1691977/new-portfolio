<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="performance-marketing-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>

    <!-- Ambient Glow Light Gradients -->
    <radialGradient id="performance-marketing-glow1" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="performance-marketing-glow2" cx="70%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="performance-marketing-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="performance-marketing-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="performance-marketing-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#performance-marketing-bg)"/>
  <rect width="800" height="450" fill="url(#performance-marketing-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="180" r="280" fill="url(#performance-marketing-glow1)"/>
  <circle cx="560" cy="300" r="240" fill="url(#performance-marketing-glow2)"/>

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="800" height="3" fill="url(#performance-marketing-accent)"/>

  <!-- Corner Tech Reticle Lines -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Central Custom Artwork -->
  
      <!-- Real-Time ROAS, CPA, CTR & Financial Telemetry -->
      <g transform="translate(150, 75)">
        <rect width="500" height="280" rx="14" fill="#060f18" stroke="#10b981" stroke-width="1.5"/>
        
        <!-- 4 Telemetry Gauges -->
        <g transform="translate(25, 25)">
          <rect width="105" height="65" rx="8" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
          <rect x="15" y="15" width="40" height="8" rx="2" fill="rgba(255,255,255,0.4)"/>
          <text x="15" y="48" fill="#10b981" font-family="monospace" font-size="18" font-weight="bold">5.8x</text>
        </g>
        <g transform="translate(140, 25)">
          <rect width="105" height="65" rx="8" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.3"/>
          <rect x="15" y="15" width="40" height="8" rx="2" fill="rgba(255,255,255,0.4)"/>
          <text x="15" y="48" fill="#06b6d4" font-family="monospace" font-size="18" font-weight="bold">4.2%</text>
        </g>
        <g transform="translate(255, 25)">
          <rect width="105" height="65" rx="8" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.3"/>
          <rect x="15" y="15" width="40" height="8" rx="2" fill="rgba(255,255,255,0.4)"/>
          <text x="15" y="48" fill="#f59e0b" font-family="monospace" font-size="18" font-weight="bold">$1.12</text>
        </g>
        <g transform="translate(370, 25)">
          <rect width="105" height="65" rx="8" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.3"/>
          <rect x="15" y="15" width="40" height="8" rx="2" fill="rgba(255,255,255,0.4)"/>
          <text x="15" y="48" fill="#8b5cf6" font-family="monospace" font-size="18" font-weight="bold">+148%</text>
        </g>

        <!-- Dynamic Candlestick/Bar Conversion Chart -->
        <g transform="translate(40, 110)">
          <line x1="0" y1="130" x2="420" y2="130" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
          
          <rect x="20" y="80" width="28" height="50" rx="4" fill="#10b981" fill-opacity="0.6"/>
          <rect x="65" y="55" width="28" height="75" rx="4" fill="#10b981" fill-opacity="0.8"/>
          <rect x="110" y="70" width="28" height="60" rx="4" fill="#f59e0b" fill-opacity="0.6"/>
          <rect x="155" y="35" width="28" height="95" rx="4" fill="#10b981"/>
          <rect x="200" y="20" width="28" height="110" rx="4" fill="#10b981"/>
          <rect x="245" y="45" width="28" height="85" rx="4" fill="#06b6d4"/>
          <rect x="290" y="10" width="28" height="120" rx="4" fill="#10b981"/>
          <rect x="335" y="5" width="28" height="125" rx="4" fill="#34d399"/>
          <rect x="380" y="0" width="28" height="130" rx="4" fill="#10b981"/>

          <!-- Target Trendline -->
          <path d="M 34 85 L 79 60 L 124 72 L 169 40 L 214 25 L 259 48 L 304 15 L 394 5" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4"/>
        </g>
      </g>
    
</svg>
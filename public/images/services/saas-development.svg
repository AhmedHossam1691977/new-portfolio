<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="saas-development-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>

    <!-- Ambient Glow Light Gradients -->
    <radialGradient id="saas-development-glow1" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="saas-development-glow2" cx="70%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="saas-development-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="saas-development-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="saas-development-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#saas-development-bg)"/>
  <rect width="800" height="450" fill="url(#saas-development-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="180" r="280" fill="url(#saas-development-glow1)"/>
  <circle cx="560" cy="300" r="240" fill="url(#saas-development-glow2)"/>

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="800" height="3" fill="url(#saas-development-accent)"/>

  <!-- Corner Tech Reticle Lines -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#ec4899" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#ec4899" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Central Custom Artwork -->
  
      <!-- Multi-Tenant SaaS Cloud Dashboard Mockup -->
      <g transform="translate(160, 75)">
        <rect width="480" height="280" rx="14" fill="#0b0e1e" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6"/>
        <!-- Sidebar Navigation -->
        <rect x="0" y="0" width="90" height="280" rx="14" fill="#080a16"/>
        <circle cx="45" cy="35" r="14" fill="#8b5cf6" fill-opacity="0.4"/>
        <rect x="20" y="70" width="50" height="8" rx="4" fill="#8b5cf6" fill-opacity="0.8"/>
        <rect x="20" y="95" width="50" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
        <rect x="20" y="115" width="50" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
        <rect x="20" y="135" width="50" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
        <rect x="20" y="155" width="50" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
        <rect x="20" y="240" width="50" height="16" rx="4" fill="#8b5cf6" fill-opacity="0.3"/>

        <!-- Top Header Bar -->
        <rect x="110" y="20" width="180" height="14" rx="4" fill="rgba(255,255,255,0.2)"/>
        <circle cx="430" cy="27" r="10" fill="#ec4899" fill-opacity="0.5"/>
        <circle cx="455" cy="27" r="10" fill="#8b5cf6" fill-opacity="0.5"/>

        <!-- 3 KPI Cards -->
        <rect x="110" y="55" width="105" height="55" rx="8" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.3"/>
        <rect x="125" y="70" width="50" height="14" rx="4" fill="#8b5cf6"/>
        <rect x="125" y="90" width="70" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>

        <rect x="230" y="55" width="105" height="55" rx="8" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.3"/>
        <rect x="245" y="70" width="50" height="14" rx="4" fill="#ec4899"/>
        <rect x="245" y="90" width="70" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>

        <rect x="350" y="55" width="105" height="55" rx="8" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.3"/>
        <rect x="365" y="70" width="50" height="14" rx="4" fill="#06b6d4"/>
        <rect x="365" y="90" width="70" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>

        <!-- Revenue Analytics Graph -->
        <rect x="110" y="125" width="345" height="135" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
        <!-- Chart Curve with Gradient Fill -->
        <path d="M 130 230 Q 180 180, 230 190 T 330 150 T 430 140 L 430 240 L 130 240 Z" fill="#8b5cf6" fill-opacity="0.15"/>
        <path d="M 130 230 Q 180 180, 230 190 T 330 150 T 430 140" fill="none" stroke="#8b5cf6" stroke-width="3"/>
        <circle cx="230" cy="190" r="4" fill="#8b5cf6"/>
        <circle cx="330" cy="150" r="4" fill="#ec4899"/>
        <circle cx="430" cy="140" r="5" fill="#38bdf8"/>
      </g>
    
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="social-media-management-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>

    <!-- Ambient Glow Light Gradients -->
    <radialGradient id="social-media-management-glow1" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="social-media-management-glow2" cx="70%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="social-media-management-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="social-media-management-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="social-media-management-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#social-media-management-bg)"/>
  <rect width="800" height="450" fill="url(#social-media-management-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="180" r="280" fill="url(#social-media-management-glow1)"/>
  <circle cx="560" cy="300" r="240" fill="url(#social-media-management-glow2)"/>

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="800" height="3" fill="url(#social-media-management-accent)"/>

  <!-- Corner Tech Reticle Lines -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Central Custom Artwork -->
  
      <!-- Social Media Schedule Dashboard -->
      <g transform="translate(160, 75)">
        <rect width="480" height="280" rx="14" fill="#080c1a" stroke="#3b82f6" stroke-width="1.5"/>
        
        <!-- Top Week Header -->
        <rect x="20" y="20" width="440" height="35" rx="8" fill="#3b82f6" fill-opacity="0.15"/>
        <circle cx="50" cy="37" r="8" fill="#3b82f6"/>
        <circle cx="120" cy="37" r="8" fill="#8b5cf6"/>
        <circle cx="190" cy="37" r="8" fill="#3b82f6"/>
        <circle cx="260" cy="37" r="8" fill="#8b5cf6"/>
        <circle cx="330" cy="37" r="8" fill="#3b82f6"/>
        <circle cx="400" cy="37" r="8" fill="#22c55e"/>

        <!-- Feed Schedule Grid Cards -->
        <g transform="translate(20, 75)">
          <rect width="135" height="175" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
          <rect x="12" y="15" width="110" height="65" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
          <rect x="12" y="90" width="80" height="8" rx="2" fill="rgba(255,255,255,0.6)"/>
          <rect x="12" y="105" width="110" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>
          <rect x="12" y="135" width="60" height="20" rx="6" fill="#22c55e" fill-opacity="0.3"/>
        </g>

        <g transform="translate(170, 75)">
          <rect width="135" height="175" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
          <rect x="12" y="15" width="110" height="65" rx="6" fill="#8b5cf6" fill-opacity="0.2"/>
          <rect x="12" y="90" width="80" height="8" rx="2" fill="rgba(255,255,255,0.6)"/>
          <rect x="12" y="105" width="110" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>
          <rect x="12" y="135" width="60" height="20" rx="6" fill="#3b82f6" fill-opacity="0.3"/>
        </g>

        <g transform="translate(320, 75)">
          <rect width="135" height="175" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
          <rect x="12" y="15" width="110" height="65" rx="6" fill="#06b6d4" fill-opacity="0.2"/>
          <rect x="12" y="90" width="80" height="8" rx="2" fill="rgba(255,255,255,0.6)"/>
          <rect x="12" y="105" width="110" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>
          <rect x="12" y="135" width="60" height="20" rx="6" fill="#f59e0b" fill-opacity="0.3"/>
        </g>
      </g>
    
</svg>
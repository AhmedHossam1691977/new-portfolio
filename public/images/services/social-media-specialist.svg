<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="social-media-specialist-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>

    <!-- Ambient Glow Light Gradients -->
    <radialGradient id="social-media-specialist-glow1" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="social-media-specialist-glow2" cx="70%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="social-media-specialist-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="50%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="social-media-specialist-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="social-media-specialist-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#social-media-specialist-bg)"/>
  <rect width="800" height="450" fill="url(#social-media-specialist-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="180" r="280" fill="url(#social-media-specialist-glow1)"/>
  <circle cx="560" cy="300" r="240" fill="url(#social-media-specialist-glow2)"/>

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="800" height="3" fill="url(#social-media-specialist-accent)"/>

  <!-- Corner Tech Reticle Lines -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#d946ef" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#d946ef" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Central Custom Artwork -->
  
      <!-- Viral Reach Analysis & Engagement Growth Curve -->
      <g transform="translate(150, 80)">
        <rect width="500" height="270" rx="14" fill="#0c0e1e" stroke="#d946ef" stroke-width="1.5"/>
        
        <!-- Heatmap Grid Section -->
        <g transform="translate(25, 30)">
          <rect width="180" height="210" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
          <!-- Matrix Blocks -->
          <rect x="20" y="25" width="30" height="30" rx="4" fill="#d946ef" fill-opacity="0.2"/>
          <rect x="58" y="25" width="30" height="30" rx="4" fill="#d946ef" fill-opacity="0.6"/>
          <rect x="96" y="25" width="30" height="30" rx="4" fill="#d946ef" fill-opacity="0.9"/>
          <rect x="134" y="25" width="30" height="30" rx="4" fill="#d946ef" fill-opacity="0.4"/>

          <rect x="20" y="65" width="30" height="30" rx="4" fill="#8b5cf6" fill-opacity="0.8"/>
          <rect x="58" y="65" width="30" height="30" rx="4" fill="#8b5cf6" fill-opacity="0.3"/>
          <rect x="96" y="65" width="30" height="30" rx="4" fill="#8b5cf6" fill-opacity="0.5"/>
          <rect x="134" y="65" width="30" height="30" rx="4" fill="#8b5cf6" fill-opacity="0.9"/>

          <rect x="20" y="105" width="30" height="30" rx="4" fill="#38bdf8" fill-opacity="0.4"/>
          <rect x="58" y="105" width="30" height="30" rx="4" fill="#38bdf8" fill-opacity="0.8"/>
          <rect x="96" y="105" width="30" height="30" rx="4" fill="#38bdf8" fill-opacity="0.2"/>
          <rect x="134" y="105" width="30" height="30" rx="4" fill="#38bdf8" fill-opacity="0.6"/>

          <rect x="20" y="150" width="144" height="35" rx="6" fill="#d946ef" fill-opacity="0.2"/>
        </g>

        <!-- Exponential Follower Growth Chart -->
        <g transform="translate(225, 30)">
          <rect width="250" height="210" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
          <path d="M 20 180 Q 80 170, 120 140 T 180 80 T 230 40 L 230 190 L 20 190 Z" fill="#d946ef" fill-opacity="0.15"/>
          <path d="M 20 180 Q 80 170, 120 140 T 180 80 T 230 40" fill="none" stroke="#d946ef" stroke-width="3"/>
          <circle cx="120" cy="140" r="4" fill="#d946ef"/>
          <circle cx="180" cy="80" r="5" fill="#8b5cf6"/>
          <circle cx="230" cy="40" r="6" fill="#f0abfc"/>
        </g>
      </g>
    
</svg>